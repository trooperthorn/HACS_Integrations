# ------------------------------------------------------------------
# media.yaml — movie mode, whole-home announcements, idle cleanup
# Integrations: Cast, Android TV Remote, Samsung TV, Yamaha YNCA,
#               Monoprice (multi-zone), UniFi Protect (speaker)
# ------------------------------------------------------------------

script:
  movie_time:
    alias: "Movie time"
    icon: mdi:movie-open
    sequence:
      - action: media_player.turn_on
        target:
          entity_id:
            - media_player.samsung_tv            # TODO: your TV
            - media_player.yamaha_receiver       # TODO: Yamaha YNCA receiver
      - action: media_player.select_source
        target:
          entity_id: media_player.yamaha_receiver
        data:
          source: "HDMI1"                        # TODO: the input your TV feeds
      - action: light.turn_on
        target:
          entity_id: light.living_room           # TODO: media room lights
        data:
          brightness_pct: 15
      - action: cover.close_cover
        target:
          entity_id: cover.switchbot_living_room_curtain

  movie_over:
    alias: "Movie over"
    icon: mdi:movie-off
    sequence:
      - action: media_player.turn_off
        target:
          entity_id:
            - media_player.samsung_tv
            - media_player.yamaha_receiver
      - action: light.turn_on
        target:
          entity_id: light.living_room
        data:
          brightness_pct: 80

  # Whole-home announce that respects quiet hours. Call with:
  #   action: script.announce
  #   data: { message: "Dinner is ready" }
  announce:
    alias: "Announce"
    icon: mdi:bullhorn
    fields:
      message:
        description: "Text to speak"
        example: "Dinner is ready"
    sequence:
      - condition: state
        entity_id: input_boolean.quiet_hours
        state: "off"
      - action: tts.speak
        target:
          entity_id: tts.google_translate_en_com   # TODO: your TTS entity
        data:
          media_player_entity_id: media_player.all_speakers  # TODO: Cast group
          message: "{{ message }}"

  # Monoprice whole-home audio: one-tap party preset across zones.
  party_audio_on:
    alias: "Party audio on"
    icon: mdi:speaker-multiple
    sequence:
      - repeat:
          for_each:
            - media_player.monoprice_zone_1        # TODO: your Monoprice zones
            - media_player.monoprice_zone_2
            - media_player.monoprice_zone_3
          sequence:
            - action: media_player.turn_on
              target:
                entity_id: "{{ repeat.item }}"
            - action: media_player.select_source
              target:
                entity_id: "{{ repeat.item }}"
              data:
                source: "Source 1"                 # TODO: your streaming source
            - action: media_player.volume_set
              target:
                entity_id: "{{ repeat.item }}"
              data:
                volume_level: 0.35

automation:
  # Receivers and zone amps love to stay on forever. Kill them when idle.
  - alias: "Media: turn off idle receiver"
    id: media_idle_receiver_off
    mode: restart
    triggers:
      - trigger: state
        entity_id:
          - media_player.yamaha_receiver
          - media_player.monoprice_zone_1
          - media_player.monoprice_zone_2
          - media_player.monoprice_zone_3
        to: "idle"
        for: "00:30:00"
      - trigger: state
        entity_id:
          - media_player.yamaha_receiver
        to: "paused"
        for: "01:00:00"
    actions:
      - action: media_player.turn_off
        target:
          entity_id: "{{ trigger.entity_id }}"

  # Pause the movie automatically when the doorbell camera sees someone.
  - alias: "Media: pause when person at front door"
    id: media_pause_on_doorbell
    mode: single
    triggers:
      - trigger: state
        entity_id: binary_sensor.unifiprotect_doorbell_person   # TODO: Protect person/occupancy sensor
        to: "on"
    conditions:
      - condition: state
        entity_id: media_player.samsung_tv
        state: "playing"
    actions:
      - action: media_player.media_pause
        target:
          entity_id: media_player.samsung_tv
      - action: notify.notify
        data:
          title: "🔔 Someone at the door"
          message: "Paused the TV — person detected at the front door."
          data:
            entity_id: camera.unifiprotect_doorbell      # TODO: doorbell camera
